<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Terminal</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #000; }
    body {
      position: fixed;
      inset: 0;
      overflow: hidden;
      color: #858585;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    pre {
      position: absolute;
      left: calc(22px + env(safe-area-inset-left));
      bottom: calc(24px + env(safe-area-inset-bottom));
      margin: 0;
      font: inherit;
      white-space: pre-wrap;
    }
    .cursor { animation: blink 1.2s steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }
  </style>
</head>
<body>
  <pre>SYSTEM READY
DEVICE ONLINE
BUILD 001

&gt; <span class="cursor">█</span></pre>
  <script>
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js");
  </script>
</body>
</html>
