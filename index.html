<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="./manifest.webmanifest">
  <title>Terminal</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      overscroll-behavior: none;
      background: #000;
    }
    body {
      position: fixed;
      inset: 0;
      color: #858585;
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
    }
    .viewport {
      position: fixed;
      z-index: 2;
      inset: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      overflow-x: auto;
      overflow-y: hidden;
      overscroll-behavior-x: contain;
      touch-action: pan-x;
      scrollbar-width: none;
      -webkit-overflow-scrolling: touch;
      background: transparent;
      cursor: grab;
    }
    .viewport::-webkit-scrollbar { display: none; }
    .viewport.panning { cursor: grabbing; }
    .world {
      position: relative;
      z-index: 2;
      min-width: 100%;
      height: 100%;
      pointer-events: none;
    }
    .card {
      --x: 0px;
      --y: 0px;
      --rotation: 0deg;
      --sink-glow: 0;
      position: absolute;
      top: 0;
      left: 0;
      width: var(--w);
      min-height: var(--h);
      color: #858585;
      transform: translate3d(var(--x), var(--y), 0) rotate(var(--rotation));
      transform-origin: center;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      cursor: grab;
      will-change: transform;
      pointer-events: auto;
    }
    .card[hidden] { display: none; }
    .card:focus { outline: none; }
    .card:focus-visible .card-inner { outline: 1px solid #303030; outline-offset: 2px; }
    .card-inner {
      width: 100%;
      min-height: var(--h);
      padding: 16px;
      overflow: hidden;
      border-radius: var(--radius, 21px);
      background: var(--surface, #121212);
      box-shadow: 0 7px 25px rgb(0 0 0 / 30%);
      transform: scale(var(--hold-scale, 1));
      transform-origin: center;
      transition: transform 130ms cubic-bezier(.2,.7,.25,1), box-shadow 150ms ease, background 160ms ease;
    }
    .card.dragging { cursor: grabbing; }
    .card.dragging .card-inner {
      box-shadow:
        0 15px 38px rgb(0 0 0 / 48%),
        0 0 calc(14px + var(--sink-glow) * 28px) rgb(7 134 62 / calc(var(--sink-glow) * 42%)),
        0 0 calc(30px + var(--sink-glow) * 48px) rgb(4 91 43 / calc(var(--sink-glow) * 24%));
    }
    .card.dragging.sink-engaged .card-inner,
    .card.completing .card-inner {
      box-shadow:
        0 0 34px rgb(12 166 77 / 54%),
        0 0 76px rgb(6 112 52 / 38%);
    }
    .card.command-moving {
      transition: transform 420ms cubic-bezier(.22,.8,.28,1);
    }
    .card.completing {
      animation: card-absorb 520ms cubic-bezier(.42,0,.22,1) forwards;
    }
    @keyframes card-absorb {
      0% {
        transform: translate3d(var(--from-x), var(--from-y), 0) rotate(var(--rotation)) scale(.9);
        opacity: 1;
        filter: blur(0);
      }
      42% {
        transform: translate3d(var(--to-x), var(--to-y), 0) rotate(calc(var(--rotation) + 4deg)) scale(.65);
        opacity: 1;
        filter: blur(1px);
      }
      78% {
        transform: translate3d(var(--to-x), var(--to-y), 0) rotate(calc(var(--rotation) + 8deg)) scale(.2);
        opacity: .9;
        filter: blur(4px);
      }
      100% {
        transform: translate3d(var(--to-x), var(--to-y), 0) rotate(calc(var(--rotation) + 11deg)) scale(0);
        opacity: 0;
        filter: blur(8px);
      }
    }
    .shape-work { --w: 164px; --h: 154px; --surface: #141414; --radius: 23px; }
    .shape-message { --w: 154px; --h: 92px; --surface: #111; --radius: 20px; }
    .shape-package { --w: 224px; --h: 88px; --surface: #151515; --radius: 21px; }
    .shape-gmm { --w: 204px; --h: 118px; --surface: #121212; --radius: 22px; }
    .shape-watch { --w: 126px; --h: 154px; --surface: #151515; --radius: 22px; }
    .shape-calendar { --w: 168px; --h: 112px; --surface: #111; --radius: 20px; }
    .shape-reminder { --w: 142px; --h: 92px; --surface: #141414; --radius: 19px; }
    .shape-read { --w: 218px; --h: 100px; --surface: #121212; --radius: 22px; }
    .kind {
      margin-bottom: 11px;
      color: #5f5f5f;
      font-size: 9px;
      letter-spacing: .12em;
    }
    .primary { position: relative; z-index: 1; color: #9a9a9a; }
    .secondary { position: relative; z-index: 1; color: #707070; }
    .detail {
      position: relative;
      z-index: 1;
      max-height: 0;
      margin-top: 0;
      overflow: hidden;
      color: #616161;
      opacity: 0;
      transition: max-height 180ms ease, margin-top 180ms ease, opacity 180ms ease;
    }
    .card.expanded .detail {
      max-height: 40px;
      margin-top: 10px;
      opacity: 1;
    }
    .thumbnail {
      position: absolute;
      right: 11px;
      bottom: 11px;
      width: 78px;
      height: 57px;
      overflow: hidden;
      border-radius: 14px;
      background: #090909;
    }
    .thumbnail::before,
    .thumbnail::after {
      content: "";
      position: absolute;
      border: 1px solid #191919;
      border-radius: 50%;
    }
    .thumbnail::before { width: 62px; height: 62px; left: 20px; top: 13px; }
    .thumbnail::after { width: 36px; height: 36px; left: -9px; top: -11px; }
    .shape-gmm .primary,
    .shape-gmm .secondary,
    .shape-gmm .detail { max-width: 93px; }
    .sink {
      --intensity: 0;
      position: fixed;
      z-index: 0;
      left: 58vw;
      bottom: calc(env(safe-area-inset-bottom) + 114px);
      width: 220px;
      height: 220px;
      pointer-events: none;
      opacity: 0;
      transform: translateX(-50%);
      transition: opacity 100ms linear;
    }
    body.drag-active .sink {
      opacity: calc(.48 + var(--intensity) * .48);
    }
    .sink::before {
      content: "";
      position: absolute;
      inset: -54px -112px;
      border-radius: 50%;
      background: radial-gradient(ellipse at center,
        rgb(9 122 58 / 42%) 0%,
        rgb(6 91 43 / 31%) 27%,
        rgb(3 57 27 / 19%) 49%,
        rgb(2 32 15 / 9%) 68%,
        rgb(0 9 4 / 0%) 86%);
      filter: blur(24px) drop-shadow(0 0 24px rgb(5 81 39 / 28%));
      transform: scale(calc(.94 + var(--intensity) * .12));
      transition: transform 90ms linear, filter 90ms linear;
    }
    .sink.magnetic::before { filter: blur(23px) brightness(1.3) drop-shadow(0 0 30px rgb(7 119 56 / 44%)); }
    .sink.engaged::before {
      filter: blur(21px) brightness(1.72) drop-shadow(0 0 38px rgb(9 148 68 / 60%));
      transform: scale(1.02);
    }
    .sink.absorbing { opacity: 1; }
    .sink.absorbing::before { animation: absorb 520ms cubic-bezier(.45,0,.18,1) forwards; }
    @keyframes absorb {
      0% { transform: scale(1.02); opacity: 1; filter: blur(21px) brightness(1.5) drop-shadow(0 0 30px rgb(8 132 62 / 56%)); }
      22% { transform: scale(1.12); opacity: 1; filter: blur(20px) brightness(1.95) drop-shadow(0 0 44px rgb(12 175 80 / 72%)); }
      58% { transform: scale(.62); opacity: 1; filter: blur(16px) brightness(2.1) drop-shadow(0 0 34px rgb(10 164 75 / 76%)); }
      80% { transform: scale(.18); opacity: .9; filter: blur(10px) brightness(2.35) drop-shadow(0 0 24px rgb(8 147 67 / 72%)); }
      100% { transform: scale(.03); opacity: 0; filter: blur(4px) brightness(1.2) drop-shadow(0 0 0 rgb(0 0 0 / 0%)); }
    }
    @media (min-width: 600px) {
      .sink {
        left: 46vw;
        bottom: calc(env(safe-area-inset-bottom) + 48px);
        width: 250px;
        height: 240px;
      }
      .sink::before {
        inset: -78px -170px;
      }
    }
    .thumb-keyboard {
      position: fixed;
      z-index: 1;
      left: env(safe-area-inset-left);
      right: env(safe-area-inset-right);
      bottom: calc(env(safe-area-inset-bottom) + 124px);
      height: clamp(210px, 32vh, 300px);
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      opacity: 0;
      animation: keyboard-reveal 1.5s ease 2s forwards;
    }
    .thumb-key {
      position: absolute;
      left: var(--key-x);
      top: var(--key-y);
      display: grid;
      width: 48px;
      height: 48px;
      margin: 0;
      padding: 0;
      place-items: center;
      border: 0;
      outline: 0;
      border-radius: 50%;
      background: transparent;
      color: rgb(139 139 139 / 9%);
      font: 10px/1 ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      transform: translate(-50%, -50%) scale(1);
      transform-origin: center;
      transition: color 180ms ease, transform 130ms cubic-bezier(.2,.75,.25,1);
      touch-action: none;
      pointer-events: auto;
      -webkit-tap-highlight-color: transparent;
    }
    .thumb-key::before {
      content: "";
      position: absolute;
      inset: 2px;
      z-index: -1;
      border-radius: 50%;
      background: radial-gradient(circle, rgb(205 205 198 / 21%) 0%, rgb(151 151 145 / 8%) 42%, transparent 72%);
      opacity: 0;
      transform: scale(.58);
    }
    body.keyboard-active .thumb-key {
      color: rgb(146 146 146 / 20%);
    }
    .thumb-key.pressed {
      color: rgb(210 210 204 / 72%);
      transform: translate(-50%, -50%) scale(1.08);
    }
    .thumb-key.pressed::before {
      opacity: 1;
      transform: scale(1.08);
    }
    .thumb-key.afterglow {
      animation: key-letter-afterglow 360ms ease-out forwards;
    }
    .thumb-key.afterglow::before {
      animation: key-afterglow 360ms ease-out forwards;
    }
    .thumb-key.control {
      color: rgb(139 139 139 / 11%);
      font-size: 11px;
    }
    body.keyboard-active .thumb-key.control {
      color: rgb(151 151 151 / 22%);
    }
    .thumb-key.space {
      width: 112px;
      border-radius: 50%;
    }
    .thumb-key.space span {
      width: 18px;
      height: 1px;
      background: currentColor;
    }
    @keyframes key-afterglow {
      0% { opacity: .58; transform: scale(1); }
      100% { opacity: 0; transform: scale(1.5); }
    }
    @keyframes key-letter-afterglow {
      0% { color: rgb(198 198 192 / 48%); }
      100% { color: rgb(146 146 146 / 20%); }
    }
    @keyframes keyboard-reveal {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @media (min-width: 600px) {
      .thumb-keyboard {
        bottom: calc(env(safe-area-inset-bottom) + 112px);
      }
      .thumb-key {
        width: 54px;
        height: 54px;
      }
      .thumb-key.space { width: 132px; }
    }
    @media (max-height: 520px) {
      .thumb-keyboard {
        bottom: calc(env(safe-area-inset-bottom) + 135px);
        height: 190px;
      }
    }
    .terminal {
      position: fixed;
      z-index: 4;
      left: calc(22px + env(safe-area-inset-left));
      bottom: calc(24px + env(safe-area-inset-bottom));
      min-width: 120px;
      color: #858585;
      pointer-events: none;
    }
    .terminal-status { white-space: pre; }
    .command,
    .response {
      display: flex;
      align-items: baseline;
      min-height: 18px;
      margin-top: 18px;
      pointer-events: auto;
    }
    .command { cursor: text; }
    .command:focus { outline: none; }
    .command[hidden],
    .response[hidden] { display: none; }
    .command-input {
      max-width: calc(100vw - 72px);
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .cursor { animation: blink 1.2s steps(1, end) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .thumb-keyboard { opacity: 1; animation: none; }
      .cursor { animation: none; }
      .detail,
      .card-inner,
      .card.command-moving { transition-duration: 1ms; }
    }
  </style>
</head>
<body>
  <div class="viewport" id="viewport">
    <div class="sink" id="sink" aria-hidden="true"></div>
    <section class="thumb-keyboard" id="thumb-keyboard" aria-label="Custom thumb keyboard"></section>
    <main class="world" id="world" aria-label="Today spatial items"></main>
  </div>

  <section class="terminal" aria-label="Today terminal">
    <div class="terminal-status"><span id="date"></span>
<span id="time"></span>
<span id="count"></span></div>
    <div class="command" id="command-form" role="button" tabindex="0" aria-label="Activate command input">
      <span>&gt;&nbsp;</span><span class="command-input" id="command-input"></span><span class="cursor">█</span>
    </div>
    <div class="response" id="response" aria-live="polite" hidden></div>
  </section>

  <script>
    const cardData = [
      { id: "work", kind: "WORK", primary: "Dark mode QA", secondary: "due tomorrow", detail: "Review colors and component states", shape: "work", rotation: -1.1 },
      { id: "message", kind: "MESSAGE", primary: "Pedro", secondary: "waiting for reply · 3h", detail: 'Last message: "Let me know what you think"', shape: "message", rotation: .8 },
      { id: "package", kind: "PACKAGE", primary: "Omniva", secondary: "2 days left", detail: "Parcel machine · Tallinn", shape: "package", rotation: -.45 },
      { id: "gmm", kind: "GMM", primary: "New episode", secondary: "42 min", detail: "Uploaded today", shape: "gmm", rotation: 1.05, thumbnail: true },
      { id: "watch", kind: "WATCH", primary: "For you", secondary: "3 min", detail: "Recommended for tonight", shape: "watch", rotation: -.75 },
      { id: "calendar", kind: "CALENDAR", primary: "Design review", secondary: "tomorrow · 14:00", detail: "30 min · Product Design", shape: "calendar", rotation: .55 },
      { id: "reminder", kind: "REMINDER", primary: "Order dog food", secondary: "this week", detail: "Running low soon", shape: "reminder", rotation: -1.2 },
      { id: "read", kind: "READ", primary: "Saved article", secondary: "8 min", detail: "Saved yesterday", shape: "read", rotation: .7 }
    ];

    const viewport = document.querySelector("#viewport");
    const world = document.querySelector("#world");
    const sink = document.querySelector("#sink");
    const keyboard = document.querySelector("#thumb-keyboard");
    const dateLabel = document.querySelector("#date");
    const timeLabel = document.querySelector("#time");
    const countLabel = document.querySelector("#count");
    const commandForm = document.querySelector("#command-form");
    const commandInput = document.querySelector("#command-input");
    const response = document.querySelector("#response");
    const storageKey = "today-os-state-v2";
    const cards = new Map();
    const state = new Map();
    let completed = new Set();
    let worldWidth = 0;
    let topLayer = cardData.length;
    let responseTimer;
    let resizeFrame;
    let panFrame;
    let lastViewportWidth = 0;
    let lastViewportHeight = 0;
    let commandValue = "";
    const keyTimers = new WeakMap();

    const keyboardLayout = [
      ["q", 7, 70], ["a", 7, 82], ["z", 7, 94],
      ["w", 17, 54], ["s", 17, 70], ["x", 17, 86],
      ["e", 27, 38], ["d", 27, 56], ["c", 27, 74],
      ["r", 37, 22], ["f", 37, 42], ["v", 37, 62],
      ["t", 45, 8], ["g", 45, 30], ["b", 45, 52],
      ["y", 55, 8], ["h", 55, 30], ["n", 55, 52],
      ["u", 63, 22], ["j", 63, 42], ["m", 63, 62],
      ["i", 73, 38], ["k", 73, 56],
      ["o", 83, 54], ["l", 83, 70], ["p", 93, 70],
      ["space", 50, 84], ["backspace", 92, 90], ["enter", 73, 90]
    ];

    const clamp = (value, min, max) => Math.min(Math.max(value, min), Math.max(min, max));

    function readSavedState() {
      try { return JSON.parse(localStorage.getItem(storageKey)) || {}; }
      catch { return {}; }
    }

    const saved = readSavedState();
    completed = new Set((saved.completed || []).filter(id => cardData.some(card => card.id === id)));

    function renderCards() {
      cardData.forEach((data, index) => {
        const card = document.createElement("article");
        card.className = `card shape-${data.shape}`;
        card.dataset.id = data.id;
        card.setAttribute("role", "button");
        card.setAttribute("tabindex", "0");
        card.setAttribute("aria-expanded", "false");
        card.style.setProperty("--rotation", `${data.rotation}deg`);
        card.style.zIndex = saved.positions?.[data.id]?.z || index + 1;
        card.innerHTML = `<div class="card-inner">
          <div class="kind">${data.kind}</div>
          <div class="primary">${data.primary}</div>
          <div class="secondary">${data.secondary}</div>
          <div class="detail">${data.detail}</div>
          ${data.thumbnail ? '<div class="thumbnail" aria-hidden="true"></div>' : ""}
        </div>`;
        card.hidden = completed.has(data.id);
        world.append(card);
        cards.set(data.id, card);
        topLayer = Math.max(topLayer, Number(card.style.zIndex));
      });
    }

    function defaultPosition(data, card) {
      const width = viewport.clientWidth;
      const height = viewport.clientHeight;
      const room = clamp((width - 380) / 360, 0, 1);
      const y = value => clamp(value, 18, height - card.offsetHeight - 18);
      switch (data.id) {
        case "work": return { x: width - card.offsetWidth - (16 + room * 115), y: y(38 + room * 18) };
        case "message": return { x: 52 + room * 325, y: y(150 + room * 20) };
        case "package": return { x: width - 34, y: y(270 + room * 48) };
        case "gmm": return { x: width + 120 + room * 40, y: y(66 + room * 30) };
        case "watch": return { x: width + 320 + room * 70, y: y(222 + room * 36) };
        case "calendar": return { x: width + 500 + room * 100, y: y(116 + room * 24) };
        case "reminder": return { x: width + 700 + room * 140, y: y(280 + room * 26) };
        default: return { x: width + 890 + room * 200, y: y(50 + room * 26) };
      }
    }

    function measureWorld() {
      let furthest = viewport.clientWidth;
      for (const data of cardData) {
        const card = cards.get(data.id);
        const position = defaultPosition(data, card);
        furthest = Math.max(furthest, position.x + card.offsetWidth + 150);
      }
      worldWidth = Math.ceil(furthest);
      world.style.width = `${worldWidth}px`;
    }

    function place(card, item) {
      item.x = clamp(item.x, 0, worldWidth - card.offsetWidth);
      item.y = clamp(item.y, 12, viewport.clientHeight - card.offsetHeight - 12);
      card.style.setProperty("--x", `${item.x}px`);
      card.style.setProperty("--y", `${item.y}px`);
    }

    function initializePositions() {
      measureWorld();
      cardData.forEach((data, index) => {
        const card = cards.get(data.id);
        const remembered = saved.positions?.[data.id];
        const initial = defaultPosition(data, card);
        const item = {
          x: remembered?.custom ? remembered.x * (worldWidth - card.offsetWidth) : initial.x,
          y: remembered?.custom ? remembered.y * (viewport.clientHeight - card.offsetHeight) : initial.y,
          ratioX: remembered?.x || 0,
          ratioY: remembered?.y || 0,
          custom: Boolean(remembered?.custom),
          pointer: null,
          frame: 0
        };
        state.set(data.id, item);
        card.style.zIndex = remembered?.z || index + 1;
        place(card, item);
      });
      lastViewportWidth = viewport.clientWidth;
      lastViewportHeight = viewport.clientHeight;
    }

    function saveState() {
      const positions = {};
      for (const data of cardData) {
        const card = cards.get(data.id);
        const item = state.get(data.id);
        item.ratioX = worldWidth > card.offsetWidth ? item.x / (worldWidth - card.offsetWidth) : 0;
        item.ratioY = viewport.clientHeight > card.offsetHeight ? item.y / (viewport.clientHeight - card.offsetHeight) : 0;
        positions[data.id] = {
          x: item.ratioX,
          y: item.ratioY,
          custom: item.custom,
          z: Number(card.style.zIndex) || 0
        };
      }
      try {
        localStorage.setItem(storageKey, JSON.stringify({ positions, completed: [...completed] }));
      } catch { }
    }

    function bringToFront(card) {
      topLayer += 1;
      card.style.zIndex = topLayer;
    }

    function toggleCard(card, forceOpen = false) {
      const open = forceOpen || !card.classList.contains("expanded");
      card.classList.toggle("expanded", open);
      card.setAttribute("aria-expanded", String(open));
      requestAnimationFrame(() => place(card, state.get(card.dataset.id)));
    }

    function sinkGeometry() {
      const rect = sink.getBoundingClientRect();
      return { x: rect.left + rect.width / 2, y: rect.top + rect.height / 2 };
    }

    function updateSink(card, item, pointer) {
      const cardX = item.x - viewport.scrollLeft + pointer.viewportLeft + pointer.width / 2;
      const cardY = item.y + pointer.viewportTop + pointer.height / 2;
      const deltaX = cardX - pointer.sinkX;
      const deltaY = cardY - pointer.sinkY;
      const distance = Math.hypot(deltaX, deltaY);
      const intensity = clamp(1 - (distance - 118) / 420, 0, 1);
      const cardGlow = clamp(1 - (distance - 118) / 180, 0, 1);
      pointer.inside = distance < 118;
      sink.style.setProperty("--intensity", intensity.toFixed(3));
      sink.classList.toggle("magnetic", distance < 205);
      sink.classList.toggle("engaged", pointer.inside);
      card.style.setProperty("--sink-glow", cardGlow.toFixed(3));
      card.classList.toggle("sink-engaged", pointer.inside);
      card.style.setProperty("--hold-scale", String(pointer.inside ? .9 : 1.025 - intensity * .105));
      return distance;
    }

    function clearSink(card) {
      document.body.classList.remove("drag-active");
      sink.style.setProperty("--intensity", "0");
      sink.classList.remove("absorbing", "magnetic", "engaged");
      if (card) {
        card.style.removeProperty("--hold-scale");
        card.style.removeProperty("--sink-glow");
        card.classList.remove("sink-engaged");
      }
    }

    function showResponse(message, duration = 1800) {
      clearTimeout(responseTimer);
      setKeyboardActive(false);
      response.textContent = message;
      commandForm.hidden = true;
      response.hidden = false;
      responseTimer = setTimeout(() => {
        response.hidden = true;
        commandForm.hidden = false;
      }, duration);
    }

    function updateTerminal() {
      const now = new Date();
      const weekdays = ["SUN", "MON", "TUE", "WED", "THU", "FRI", "SAT"];
      const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      const pad = value => String(value).padStart(2, "0");
      dateLabel.textContent = `${weekdays[now.getDay()]} ${pad(now.getDate())} ${months[now.getMonth()]}`;
      timeLabel.textContent = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
      countLabel.textContent = `${cardData.length - completed.size} ITEMS`;
    }

    function completeCard(card, item, pointer) {
      const id = card.dataset.id;
      completed.add(id);
      item.custom = true;
      saveState();
      updateTerminal();
      showResponse("done.");

      const targetX = pointer.sinkX - pointer.viewportLeft + viewport.scrollLeft - card.offsetWidth / 2;
      const targetY = pointer.sinkY - pointer.viewportTop - card.offsetHeight / 2;
      card.style.pointerEvents = "none";
      card.style.removeProperty("--hold-scale");
      card.style.setProperty("--from-x", `${item.x}px`);
      card.style.setProperty("--from-y", `${item.y}px`);
      card.style.setProperty("--to-x", `${targetX}px`);
      card.style.setProperty("--to-y", `${targetY}px`);
      card.classList.add("completing");
      sink.style.setProperty("--intensity", "1");
      sink.classList.add("absorbing", "engaged");

      setTimeout(() => {
        card.hidden = true;
        card.classList.remove("completing", "expanded");
        card.setAttribute("aria-expanded", "false");
        card.style.pointerEvents = "";
        card.style.removeProperty("--from-x");
        card.style.removeProperty("--from-y");
        card.style.removeProperty("--to-x");
        card.style.removeProperty("--to-y");
        clearSink(card);
      }, 530);
    }

    function settle(card, item, velocityX, velocityY) {
      let frames = 0;
      const frame = () => {
        velocityX *= .8;
        velocityY *= .8;
        item.x += velocityX;
        item.y += velocityY;
        place(card, item);
        frames += 1;
        if (frames < 14 && Math.hypot(velocityX, velocityY) > .2) {
          item.frame = requestAnimationFrame(frame);
        } else {
          saveState();
        }
      };
      item.frame = requestAnimationFrame(frame);
    }

    function attachCardInteractions(card) {
      const id = card.dataset.id;

      card.addEventListener("pointerdown", event => {
        if (event.button !== undefined && event.button !== 0) return;
        const item = state.get(id);
        cancelAnimationFrame(item.frame);
        bringToFront(card);
        card.classList.remove("command-moving");
        card.classList.add("dragging");
        card.setPointerCapture(event.pointerId);
        const viewRect = viewport.getBoundingClientRect();
        const sinkCenter = sinkGeometry();
        item.pointer = {
          id: event.pointerId,
          startX: event.clientX,
          startY: event.clientY,
          originX: item.x,
          originY: item.y,
          lastX: event.clientX,
          lastY: event.clientY,
          lastTime: event.timeStamp,
          started: event.timeStamp,
          velocityX: 0,
          velocityY: 0,
          moved: false,
          inside: false,
          viewportLeft: viewRect.left,
          viewportTop: viewRect.top,
          width: card.offsetWidth,
          height: card.offsetHeight,
          sinkX: sinkCenter.x,
          sinkY: sinkCenter.y
        };
        document.body.classList.add("drag-active");
        updateSink(card, item, item.pointer);
      });

      card.addEventListener("pointermove", event => {
        const item = state.get(id);
        const pointer = item.pointer;
        if (!pointer || pointer.id !== event.pointerId) return;
        event.preventDefault();
        const dx = event.clientX - pointer.startX;
        const dy = event.clientY - pointer.startY;
        if (Math.hypot(dx, dy) > 6) pointer.moved = true;

        const rawX = pointer.originX + dx;
        const rawY = pointer.originY + dy;
        item.x = rawX;
        item.y = rawY;
        place(card, item);

        const screenX = item.x - viewport.scrollLeft + pointer.viewportLeft + pointer.width / 2;
        const screenY = item.y + pointer.viewportTop + pointer.height / 2;
        const distance = Math.hypot(screenX - pointer.sinkX, screenY - pointer.sinkY);
        if (distance < 210) {
          const proximity = (210 - distance) / 210;
          const thresholdBoost = distance < 120 ? (120 - distance) / 120 * .18 : 0;
          const pull = .04 + proximity * proximity * .26 + thresholdBoost;
          const sinkWorldX = pointer.sinkX - pointer.viewportLeft + viewport.scrollLeft - pointer.width / 2;
          const sinkWorldY = pointer.sinkY - pointer.viewportTop - pointer.height / 2;
          item.x = rawX + (sinkWorldX - rawX) * pull;
          item.y = rawY + (sinkWorldY - rawY) * pull;
          place(card, item);
        }
        updateSink(card, item, pointer);

        const elapsed = Math.max(event.timeStamp - pointer.lastTime, 1);
        pointer.velocityX = pointer.velocityX * .55 + ((event.clientX - pointer.lastX) / elapsed) * .45;
        pointer.velocityY = pointer.velocityY * .55 + ((event.clientY - pointer.lastY) / elapsed) * .45;
        pointer.lastX = event.clientX;
        pointer.lastY = event.clientY;
        pointer.lastTime = event.timeStamp;
      });

      function release(event, cancelled = event.type === "pointercancel") {
        const item = state.get(id);
        const pointer = item.pointer;
        if (!pointer || pointer.id !== event.pointerId) return;
        item.pointer = null;
        card.classList.remove("dragging");

        if (!cancelled && !pointer.moved && event.timeStamp - pointer.started < 450) {
          clearSink(card);
          toggleCard(card);
          saveState();
          return;
        }
        if (!cancelled && pointer.inside) {
          completeCard(card, item, pointer);
          return;
        }

        clearSink(card);
        if (pointer.moved) item.custom = true;
        saveState();
        settle(
          card,
          item,
          clamp(pointer.velocityX * 8, -8, 8),
          clamp(pointer.velocityY * 8, -8, 8)
        );
      }

      card.addEventListener("pointerup", release);
      card.addEventListener("pointercancel", release);
      card.addEventListener("lostpointercapture", event => {
        const item = state.get(id);
        if (item.pointer?.id === event.pointerId) release(event, true);
      });
      addEventListener("pointerup", release);
      addEventListener("pointercancel", release);
      card.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          bringToFront(card);
          toggleCard(card);
          saveState();
        }
      });
    }

    function summon(id, message) {
      if (completed.has(id)) {
        showResponse(message);
        return;
      }
      const card = cards.get(id);
      const item = state.get(id);
      cancelAnimationFrame(item.frame);
      bringToFront(card);
      toggleCard(card, true);
      item.x = clamp(viewport.scrollLeft + viewport.clientWidth - card.offsetWidth - 28, 0, worldWidth - card.offsetWidth);
      item.y = clamp(44, 12, viewport.clientHeight - card.offsetHeight - 12);
      item.custom = true;
      card.classList.add("command-moving");
      place(card, item);
      setTimeout(() => card.classList.remove("command-moving"), 440);
      saveState();
      showResponse(message);
    }

    function resetLayout(restoreCompleted = false) {
      if (restoreCompleted) completed.clear();
      measureWorld();
      cardData.forEach((data, index) => {
        if (!restoreCompleted && completed.has(data.id)) return;
        const card = cards.get(data.id);
        const item = state.get(data.id);
        cancelAnimationFrame(item.frame);
        card.hidden = false;
        card.classList.remove("expanded", "completing");
        card.setAttribute("aria-expanded", "false");
        card.style.pointerEvents = "";
        card.style.removeProperty("--from-x");
        card.style.removeProperty("--from-y");
        card.style.removeProperty("--to-x");
        card.style.removeProperty("--to-y");
        card.style.zIndex = index + 1;
        Object.assign(item, defaultPosition(data, card), { custom: false });
        card.classList.add("command-moving");
        place(card, item);
        setTimeout(() => card.classList.remove("command-moving"), 440);
      });
      topLayer = cardData.length;
      viewport.scrollTo({ left: 0, behavior: "smooth" });
      saveState();
      updateTerminal();
    }

    function runCommand(value) {
      const command = value.trim().toLowerCase();
      if (!command) return;
      if (command.includes("restore")) {
        try { localStorage.removeItem("today-os-cards-v1"); } catch { }
        resetLayout(true);
        showResponse("items restored.");
      } else if (command.includes("reset")) {
        resetLayout(false);
        showResponse("layout reset.");
      } else if (command.includes("package") || command.includes("parcel")) {
        summon("package", "1 package waiting.");
      } else if (command.includes("what should i do") || command.includes("what should i focus on") || command.includes("focus")) {
        summon("work", "priority selected.");
      } else {
        showResponse("noted.");
      }
    }

    function renderCommand() {
      commandInput.textContent = commandValue;
    }

    function setKeyboardActive(active) {
      document.body.classList.toggle("keyboard-active", active);
      commandForm.setAttribute("aria-pressed", String(active));
    }

    function activateKeyboard() {
      setKeyboardActive(true);
      commandForm.focus({ preventScroll: true });
    }

    function submitCommand() {
      const value = commandValue;
      commandValue = "";
      renderCommand();
      setKeyboardActive(false);
      runCommand(value);
    }

    function applyKey(value) {
      if (value === "enter") {
        submitCommand();
      } else if (value === "backspace") {
        commandValue = Array.from(commandValue).slice(0, -1).join("");
        renderCommand();
      } else if (value === "space") {
        if (commandValue.length < 72 && commandValue && !commandValue.endsWith(" ")) commandValue += " ";
        renderCommand();
      } else if (commandValue.length < 72) {
        commandValue += value;
        renderCommand();
      }
    }

    function releaseKey(key) {
      if (!key.classList.contains("pressed")) return;
      key.classList.remove("pressed", "afterglow");
      void key.offsetWidth;
      key.classList.add("afterglow");
      clearTimeout(keyTimers.get(key));
      keyTimers.set(key, setTimeout(() => key.classList.remove("afterglow"), 370));
    }

    function renderKeyboard() {
      const fragment = document.createDocumentFragment();
      keyboardLayout.forEach(([value, x, y]) => {
        const key = document.createElement("button");
        const control = value.length > 1;
        key.type = "button";
        key.tabIndex = -1;
        key.className = `thumb-key${control ? " control" : ""}${value === "space" ? " space" : ""}`;
        key.dataset.key = value;
        key.style.setProperty("--key-x", `${x}%`);
        key.style.setProperty("--key-y", `${y}%`);
        key.setAttribute("aria-label", value === "space" ? "Space" : value === "backspace" ? "Backspace" : value === "enter" ? "Enter" : value.toUpperCase());
        key.innerHTML = value === "space" ? "<span aria-hidden=\"true\"></span>" : value === "backspace" ? "⌫" : value === "enter" ? "↵" : value.toUpperCase();
        key.addEventListener("pointerdown", event => {
          if (document.body.classList.contains("drag-active")) return;
          event.preventDefault();
          event.stopPropagation();
          activateKeyboard();
          clearTimeout(keyTimers.get(key));
          key.classList.remove("afterglow");
          key.classList.add("pressed");
          key.setPointerCapture(event.pointerId);
          applyKey(value);
        });
        ["pointerup", "pointercancel", "lostpointercapture"].forEach(type => {
          key.addEventListener(type, event => {
            event.preventDefault();
            event.stopPropagation();
            releaseKey(key);
          });
        });
        key.addEventListener("click", event => event.preventDefault());
        fragment.append(key);
      });
      keyboard.append(fragment);
    }

    function flashPhysicalKey(value) {
      const key = keyboard.querySelector(`[data-key="${value}"]`);
      if (!key) return;
      clearTimeout(keyTimers.get(key));
      key.classList.remove("afterglow");
      key.classList.add("pressed");
      setTimeout(() => releaseKey(key), 70);
    }

    commandForm.addEventListener("pointerdown", event => {
      event.preventDefault();
      event.stopPropagation();
      activateKeyboard();
    });
    commandForm.addEventListener("keydown", event => {
      if (event.key === "Enter" || event.key === " ") event.preventDefault();
    });
    addEventListener("keydown", event => {
      if (!document.body.classList.contains("keyboard-active") || event.ctrlKey || event.metaKey || event.altKey) return;
      const key = event.key.toLowerCase();
      const value = /^[a-z]$/.test(key) ? key : key === " " ? "space" : key === "backspace" ? "backspace" : key === "enter" ? "enter" : "";
      if (!value) return;
      event.preventDefault();
      flashPhysicalKey(value);
      applyKey(value);
    });

    viewport.addEventListener("wheel", event => {
      if (Math.abs(event.deltaY) > Math.abs(event.deltaX)) {
        viewport.scrollLeft += event.deltaY;
        event.preventDefault();
      }
    }, { passive: false });

    let backgroundPan = null;
    viewport.addEventListener("pointerdown", event => {
      if (!event.target.closest(".card")) setKeyboardActive(false);
      if (event.pointerType !== "mouse" || event.button !== 0 || event.target.closest(".card")) return;
      cancelAnimationFrame(panFrame);
      backgroundPan = { id: event.pointerId, x: event.clientX, scroll: viewport.scrollLeft, lastX: event.clientX, lastTime: event.timeStamp, velocity: 0 };
      viewport.classList.add("panning");
      viewport.setPointerCapture(event.pointerId);
    });
    viewport.addEventListener("pointermove", event => {
      if (!backgroundPan || backgroundPan.id !== event.pointerId) return;
      viewport.scrollLeft = backgroundPan.scroll - (event.clientX - backgroundPan.x);
      const elapsed = Math.max(event.timeStamp - backgroundPan.lastTime, 1);
      backgroundPan.velocity = backgroundPan.velocity * .55 + ((backgroundPan.lastX - event.clientX) / elapsed) * .45;
      backgroundPan.lastX = event.clientX;
      backgroundPan.lastTime = event.timeStamp;
    });
    function releaseBackground(event) {
      if (!backgroundPan || backgroundPan.id !== event.pointerId) return;
      let velocity = clamp(backgroundPan.velocity * 7, -14, 14);
      backgroundPan = null;
      viewport.classList.remove("panning");
      const glide = () => {
        velocity *= .86;
        viewport.scrollLeft += velocity;
        if (Math.abs(velocity) > .2) panFrame = requestAnimationFrame(glide);
      };
      panFrame = requestAnimationFrame(glide);
    }
    viewport.addEventListener("pointerup", releaseBackground);
    viewport.addEventListener("pointercancel", releaseBackground);

    addEventListener("resize", () => {
      cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => {
        const oldWorldWidth = worldWidth;
        const oldViewportWidth = lastViewportWidth;
        const oldViewportHeight = lastViewportHeight;
        const scrollRatio = oldWorldWidth > oldViewportWidth ? viewport.scrollLeft / (oldWorldWidth - oldViewportWidth) : 0;
        for (const data of cardData) {
          const card = cards.get(data.id);
          const item = state.get(data.id);
          if (item.custom) {
            item.ratioX = item.x / Math.max(1, oldWorldWidth - card.offsetWidth);
            item.ratioY = item.y / Math.max(1, oldViewportHeight - card.offsetHeight);
          }
        }
        measureWorld();
        cardData.forEach(data => {
          const card = cards.get(data.id);
          const item = state.get(data.id);
          if (item.custom) {
            item.x = item.ratioX * (worldWidth - card.offsetWidth);
            item.y = item.ratioY * (viewport.clientHeight - card.offsetHeight);
          } else {
            Object.assign(item, defaultPosition(data, card));
          }
          place(card, item);
        });
        viewport.scrollLeft = scrollRatio * Math.max(0, worldWidth - viewport.clientWidth);
        lastViewportWidth = viewport.clientWidth;
        lastViewportHeight = viewport.clientHeight;
      });
    });

    renderCards();
    renderKeyboard();
    initializePositions();
    for (const card of cards.values()) attachCardInteractions(card);
    updateTerminal();
    setInterval(updateTerminal, 15000);

    if ("serviceWorker" in navigator) {
      let refreshing = false;
      let hasController = Boolean(navigator.serviceWorker.controller);
      navigator.serviceWorker.addEventListener("controllerchange", () => {
        if (!hasController) {
          hasController = true;
          return;
        }
        if (refreshing) return;
        const lastReload = Number(sessionStorage.getItem("today-os-sw-reload")) || 0;
        if (Date.now() - lastReload < 10000) return;
        refreshing = true;
        sessionStorage.setItem("today-os-sw-reload", String(Date.now()));
        location.reload();
      });
      navigator.serviceWorker.register("./sw.js").then(registration => registration.update()).catch(() => {});
    }
  </script>
</body>
</html>
